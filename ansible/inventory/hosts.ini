# Ansible Inventory for E-Commerce Platform

# Localhost / Management Machine
[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Staging Environment (Standalone Docker / VM Hosts)
[staging_servers]
# staging-app-01 ansible_host=54.210.10.20 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ecommerce-key.pem

# Production Environment (Bastion & Application Servers)
[prod_servers]
# prod-app-01 ansible_host=54.210.20.30 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ecommerce-key.pem
# prod-app-02 ansible_host=54.210.20.31 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ecommerce-key.pem

# Kubernetes / EKS Bastion & Admin Nodes
[bastion_hosts]
# bastion-01 ansible_host=54.210.30.40 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ecommerce-key.pem

# Group of all EC2 Application Servers
[app_servers:children]
staging_servers
prod_servers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
environment_name=dev
