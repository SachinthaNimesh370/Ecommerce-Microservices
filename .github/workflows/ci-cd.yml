name: Microservices CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - dockerUp
      - CICD
  pull_request:
    branches:
      - main
      - master
      - CICD
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-test-scan-push:
    name: Build, Test, Security Scan & Push
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123123"
          POSTGRES_DB: ecommerce_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - order-service
          - inventory-service
          - notification-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Owner & Environment Variables
        run: |
          echo "REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '${{ matrix.service }}/pom.xml'

      - name: Grant Execute Permission for mvnw
        run: chmod +x ./${{ matrix.service }}/mvnw

      - name: Build and Run Tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ecommerce_test_db
          DB_USERNAME: postgres
          DB_PASSWORD: "123123"
        run: |
          cd ${{ matrix.service }}
          ./mvnw clean package -DskipTests=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step: Security Scan - Source Code & Dependencies Vulnerability Check
      - name: Run Trivy Source Code & Dependency Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.service }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Build Docker Image
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.service }}"
          IMAGE_TAG="${{ github.sha }}"
          docker build -t ${IMAGE_NAME}:${IMAGE_TAG} -t ${IMAGE_NAME}:latest ./${{ matrix.service }}

      # Step: Security Scan - Docker Image Security Scan
      - name: Run Trivy Docker Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to Container Registry
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.service }}"
          IMAGE_TAG="${{ github.sha }}"
          docker push ${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${IMAGE_NAME}:latest

      # Optional AWS Phase Integration: ECR Authentication & Deployment
      # Uncomment and configure AWS secrets when deploying to AWS ECR / EKS (Part O - Part Q)
      # - name: Configure AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1
      #
      # - name: Log in to Amazon ECR
      #   id: login-ecr
      #   uses: aws-actions/amazon-ecr-login@v2
      #
      # - name: Build & Push to Amazon ECR
      #   run: |
      #     ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
      #     docker tag ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.service }}:${{ github.sha }} $ECR_REGISTRY/${{ matrix.service }}:${{ github.sha }}
      #     docker push $ECR_REGISTRY/${{ matrix.service }}:${{ github.sha }}

  docker-compose-validate:
    name: Validate Docker Compose Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose File Syntax
        run: docker compose config
